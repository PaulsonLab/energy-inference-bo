[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-inference-bo"
version = "0.1.0"
description = "Mathematical and oracle validation for energy-based Bayesian optimization"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "PaulsonLab" }]
dependencies = [
  "botorch[fully-bayesian]>=0.16.1",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
