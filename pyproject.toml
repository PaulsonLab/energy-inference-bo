[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-policy-bo"
version = "0.1.0"
description = "Causal policy transport for critic-free nonmyopic Bayesian optimization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "PaulsonLab" }]
dependencies = [
  "matplotlib==3.11.1",
  "numpy==2.3.5",
  "pandas==3.0.1",
  "scipy==1.16.3",
  "torch==2.13.0",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.4,<5",
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
