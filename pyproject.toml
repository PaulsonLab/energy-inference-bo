[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-tilt"
version = "0.1.0"
description = "Decision-tilted Monte Carlo acquisition inference for Bayesian optimization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "PaulsonLab" }]
dependencies = [
  "botorch==0.18.1",
  "gpytorch==1.15.2",
  "matplotlib==3.11.1",
  "numpy==2.3.5",
  "scipy==1.16.3",
  "torch==2.13.0",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.4,<5",
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
